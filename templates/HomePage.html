    <script>
      // Masa isimlerini HTML'deki sınıflarla eşleştir
      const tableMapping = {
        "Table 11": "u-layout-cell-1",
        "Table 12": "u-layout-cell-2",
        "Table 21": "u-layout-cell-4",
        "Table 22": "u-layout-cell-5"
      };
    
      // API'den masaların durumunu çek ve güncelle
      async function updateTableStatus() {
        try {
          const response = await fetch('/api/status');
          const status = await response.json();
    
          // Masaların durumuna göre renkleri güncelle
          Object.keys(status).forEach((table) => {
            const className = tableMapping[table]; // HTML'deki sınıfı al
            const tableElement = document.querySelector(`.${className}`);
            if (tableElement) {
              if (status[table].occupied) {
                tableElement.style.backgroundColor = 'red'; // Doluysa kırmızı
              } else {
                tableElement.style.backgroundColor = 'green'; // Boşsa yeşil
              }
            }
          });
        } catch (error) {
          console.error('Masa durumları alınırken hata oluştu:', error);
        }
      }
    
      // Her 5 saniyede bir masaların durumunu güncelle
      setInterval(updateTableStatus, 5000);
      updateTableStatus(); // Sayfa yüklendiğinde hemen çalıştır
    </script>
