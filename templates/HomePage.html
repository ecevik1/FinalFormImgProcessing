<!DOCTYPE html>
<html style="font-size: 16px;" lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masaların Durumu</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nicepage.css') }}" media="screen">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}" media="screen">
  <script class="u-script" type="text/javascript" src="{{ url_for('static', filename='js/jquery.js') }}" defer=""></script>
  <script class="u-script" type="text/javascript" src="{{ url_for('static', filename='js/nicepage.js') }}" defer=""></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <style>
    .table-box {
      height: 150px;
      width: 200px;
      border: 4px solid #fff;
      border-radius: 10px;
      margin: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 20px;
    }
    .video-container {
      text-align: center;
      margin-top: 30px;
    }
    .timestamp {
      color: white;
      font-size: 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body class="u-body u-grey-80 u-xl-mode" data-lang="tr">
  <header class="u-clearfix u-header u-header" id="header">
    <div class="u-clearfix u-sheet u-valign-middle u-sheet-1">
      <h3 class="u-align-left u-custom-font u-headline u-text u-text-default">
        <a href="/">E-Kütüphane</a>
      </h3>
      <nav class="u-menu u-menu-one-level u-offcanvas">
        <ul class="u-nav u-unstyled">
          <li class="u-nav-item"><a href="/">Giriş Yap</a></li>
          <li class="u-nav-item"><a href="/account">Hesabım</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="u-clearfix u-section-1">
    <div class="u-sheet u-valign-middle u-sheet-1">
      <h2 class="u-align-center u-text">1. Kat Masa Doluluk Durumları</h2>
      <div class="u-layout-row" style="display: flex; flex-wrap: wrap; justify-content: center;">
        <div id="Table11" class="table-box">Masa 11<br><span class="people-count">Kişi Sayısı: --</span></div>
        <div id="Table12" class="table-box">Masa 12<br><span class="people-count">Kişi Sayısı: --</span></div>
        <div id="Table21" class="table-box">Masa 21<br><span class="people-count">Kişi Sayısı: --</span></div>
        <div id="Table22" class="table-box">Masa 22<br><span class="people-count">Kişi Sayısı: --</span></div>
      </div>

      <div class="video-container">
        <h3 class="u-text">Canlı Video</h3>
        <img id="live-frame" src="{{ url_for('video_feed') }}" width="640" height="480" />
        <div class="timestamp" id="video-time">Zaman: --</div>
      </div>
    </div>
  </section>
</body>
</html>
